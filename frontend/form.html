<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amity University | Lab Work 4 — Form</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <div class="brand"><img src="images/amity-logo.png" alt="Amity University logo" class="logo">
    <div><h1>Amity University</h1><p>Web Technologies — Lab Work 4</p></div>
  </div>
  <nav><a href="index.html">Home (Frame)</a><a class="active" href="form.html">Registration Form</a><a href="table.html">Result Table</a></nav>
</header>
<main>
  <section class="card form-card">
    <span class="eyebrow">PAGE 02 · HTML FORM + PHP</span>
    <h2>Student Registration</h2>
    <p class="muted">Enter the student details below. Required fields must be completed before submission.</p>
    <div id="msg" role="status" aria-live="polite"></div>
    <form id="studentForm" method="post" action="../backend/submit.php">
      <div class="form-grid">
        <div class="field full"><label for="name">Full Name</label><input type="text" id="name" name="name" placeholder="Enter full name" maxlength="100" required></div>
        <div class="field"><label for="enrollment">Enrollment No.</label><input type="text" id="enrollment" name="enrollment" placeholder="e.g. A2305221001" maxlength="40" required></div>
        <div class="field"><label for="email">Email</label><input type="email" id="email" name="email" placeholder="you@example.com" maxlength="150" required></div>
        <div class="field"><label for="course">Course</label><select id="course" name="course" required><option value="">— Select course —</option><option>B.Tech CSE</option><option>BCA</option><option>MCA</option><option>B.Sc IT</option></select></div>
        <div class="field"><label for="marks">Marks (0–100)</label><input type="number" id="marks" name="marks" min="0" max="100" step="1" placeholder="Enter marks" required></div>
        <fieldset class="field full"><legend>Gender</legend><div class="radio-group">
          <label><input type="radio" name="gender" value="Male" required> Male</label>
          <label><input type="radio" name="gender" value="Female"> Female</label>
          <label><input type="radio" name="gender" value="Other"> Other</label>
        </div></fieldset>
      </div>
      <div class="actions"><button type="submit" class="btn" id="submitBtn">Submit Registration</button><button type="reset" class="btn btn-light">Reset</button></div>
    </form>
  </section>
</main>
<footer>© 2026 Amity University <span>·</span> Web Technologies Lab Work 4</footer>
<script src="js/app.js"></script>
</body>
</html>
